<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="description" content="منيو حلويات فاخر — تصفح التشكيلة والأسعار بسهولة.">
  <title>حلوتك تبدأ من هنا | منيو الحلويات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header" id="top">
      <a class="brand" href="#top" aria-label="العودة إلى الرئيسية">
        <!-- تم إضافة صورة الشعار هنا -->
        <img src="4831c37d-f01c-44bc-b447-91001caf2cea.jpeg" alt="ابتكارات الحلا" class="logo-image">
        
        <!-- تم إخفاء النصوص الأصلية بصرياً فقط بدون حذفها -->
        <span class="brand-mark visually-hidden" aria-hidden="true">س</span>
        <span class="brand-name visually-hidden">سُكّر</span>
      </a>
      <a class="header-menu-link" href="#menu">المنيو</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <span class="eyebrow">DESSERT BOUTIQUE</span>
          <h1 id="hero-title">حلوتك<br><em>تبدأ من هنا</em></h1>
          <p>اكتشف تشكيلتنا المختارة من الحلويات الطازجة، المصنوعة لتكون لحظتك ألذ.</p>
          <a class="primary-btn" href="#menu">استكشف المنيو <span aria-hidden="true">↓</span></a>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="hero-glow"></div>
          <div class="hero-image-wrap">
            <img
              src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1000&q=82"
              alt=""
              fetchpriority="high"
            >
          </div>
          <span class="hero-stamp">BAKED<br>WITH LOVE</span>
        </div>
      </section>

      <section class="menu-section" id="menu" aria-labelledby="menu-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">OUR SELECTION</span>
            <h2 id="menu-title">تشكيلتنا</h2>
          </div>
          <span class="section-note">طازج يوميًا</span>
        </div>

        <nav class="categories" id="categories" aria-label="أقسام المنيو">
          <button class="category-chip active" data-category="popular">الأكثر طلبًا</button>
          <button class="category-chip" data-category="cheesecake">تشيز كيك</button>
          <button class="category-chip" data-category="cakes">كيك</button>
          <button class="category-chip" data-category="cookies">كوكيز</button>
          <button class="category-chip" data-category="crepe-waffle">كريب ووافل</button>
          <button class="category-chip" data-category="other">حلويات أخرى</button>
        </nav>

        <div id="product-sections" class="product-sections" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-logo">
        <!-- تم إضافة الشعار في الفوتر أيضاً مع إخفاء النص الأصلي -->
        <img src="4831c37d-f01c-44bc-b447-91001caf2cea.jpeg" alt="ابتكارات الحلا" class="footer-logo-image">
        <span class="visually-hidden">سُكّر</span>
      </div>
      <p>شكرًا لزيارتكم</p>
      <span>نتمنى لكم تجربة حلوة <span aria-hidden="true">🤎</span></span>
    </footer>
  </div>

  <button class="to-top" id="toTop" aria-label="العودة إلى أعلى الصفحة">↑</button>

  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <section class="product-sheet" id="productSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-describedby="sheetDescription" hidden>
    <button class="sheet-close" id="sheetClose" aria-label="إغلاق">×</button>
    <div class="sheet-image-wrap">
      <img id="sheetImage" src="" alt="">
    </div>
    <div class="sheet-content">
      <span class="sheet-kicker" id="sheetCategory"></span>
      <h2 id="sheetTitle"></h2>
      <p id="sheetDescription"></p>
      <div class="sheet-price" id="sheetPrice"></div>
      <button class="close-label" id="sheetCloseLabel">إغلاق</button>
    </div>
  </section>

  <noscript>
    <div class="noscript">يرجى تفعيل JavaScript لعرض المنيو التفاعلي.</div>
  </noscript>
  <script src="js/app.js" defer></script>
</body>
</html>
