<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="description" content="منيو حلويات فاخر — تصفح التشكيلة والأسعار بسهولة.">
  <title>ابتكارات الحلا | منيو الحلويات</title>
  <style>
/* =========================================================
   Premium Arabic Dessert Menu
   Mobile-first / RTL / Vanilla CSS
   ========================================================= */

/* --- الإضافات الجديدة الخاصة بالشعار والأنيميشن --- */

/* كلاس لإخفاء العناصر الأصلية بصرياً فقط بدون حذفها من الكود */
.visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* تنسيق صورة الشعار في الهيدر */
.logo-image {
  height: 58px; /* ارتفاع مناسب للشعار */
  width: auto;
  display: block;
  transition: transform 0.3s ease, filter 0.3s ease; /* إعداد الأنيميشن */
  border-radius: 8px; /* حواف ناعمة قليلاً للصورة */
}

/* تنسيق صورة الشعار في الفوتر */
.footer-logo-image {
  height: 70px;
  width: auto;
  margin: 0 auto;
  border-radius: 8px;
  mix-blend-mode: multiply; /* لجعل خلفية الشعار تندمج مع لون الفوتر إذا أمكن */
}

/* أنيميشن الشعار عند مرور الماوس (تكبير بسيط وظل) */
.brand:hover .logo-image {
  transform: scale(1.05);
  filter: drop-shadow(0 5px 8px rgba(183, 150, 97, 0.3));
}

/* --------------------------------------------------------- */

:root {
  --cream: #f7f1e8;
  --paper: #fffdf9;
  --beige: #e9ddcd;
  --beige-2: #d9c6af;
  --brown: #3a2820;
  --brown-soft: #6f5a4c;
  --brown-muted: #927d6e;
  --gold: #b79661;
  --line: rgba(58, 40, 32, .11);
  --shadow: 0 18px 45px rgba(58, 40, 32, .09);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --serif: "Noto Naskh Arabic", Georgia, serif;
  --sans: "IBM Plex Sans Arabic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 88px;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 85% 2%, rgba(183, 150, 97, .09), transparent 24rem),
    var(--cream);
  color: var(--brown);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body.modal-open { overflow: hidden; }

img { display: block; max-width: 100%; }

button, a { -webkit-tap-highlight-color: transparent; }

button { font: inherit; }

a { color: inherit; text-decoration: none; }

.page-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 0 18px;
}

.site-header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0; /* تم التعديل إلى 0 بدلاً من 9px لتجنب أي مسافات زائدة بعد إخفاء النص */
  font-weight: 700;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(183, 150, 97, .55);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1;
}

.brand-name {
  font-family: var(--serif);
  font-size: 23px;
}

.header-menu-link {
  font-size: 13px;
  color: var(--brown-soft);
  border-bottom: 1px solid var(--beige-2);
  padding-bottom: 3px;
}

.hero {
  min-height: 610px;
  display: grid;
  align-items: center;
  grid-template-columns: 1fr;
  gap: 30px;
  padding: 32px 0 58px;
}

.hero-copy {
  order: 2;
  position: relative;
  z-index: 2;
  max-width: 560px;
  animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both;
}

.eyebrow {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .22em;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 12px;
}

.hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 86px);
  line-height: .94;
  font-weight: 600;
  letter-spacing: -.035em;
}

.hero h1 em {
  font-style: normal;
  color: var(--brown-soft);
}

.hero p {
  margin: 22px 0 26px;
  max-width: 440px;
  color: var(--brown-soft);
  font-size: 15px;
  line-height: 2;
}

.primary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 52px;
  padding: 0 22px;
  border-radius: 999px;
  background: var(--brown);
  color: #fffaf3;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 12px 25px rgba(58, 40, 32, .16);
  transition: transform .25s ease, box-shadow .25s ease;
}

.primary-btn span { font-size: 18px; }

.primary-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(58, 40, 32, .2);
}

.primary-btn:active { transform: scale(.98); }

.hero-visual {
  order: 1;
  position: relative;
  width: min(92vw, 510px);
  justify-self: center;
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  animation: heroIn 1s cubic-bezier(.2,.7,.2,1) both;
}

.hero-glow {
  position: absolute;
  width: 72%;
  height: 72%;
  border-radius: 50%;
  background: rgba(183, 150, 97, .14);
  filter: blur(25px);
}

.hero-image-wrap {
  position: relative;
  width: 79%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  border: 8px solid rgba(255, 253, 249, .74);
  box-shadow: 0 28px 70px rgba(58, 40, 32, .17);
}

.hero-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: scale(1.04);
}

.hero-stamp {
  position: absolute;
  bottom: 8%;
  left: 2%;
  width: 78px;
  height: 78px;
  border: 1px solid rgba(183, 150, 97, .65);
  border-radius: 50%;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 8px;
  line-height: 1.55;
  letter-spacing: .1em;
  color: var(--brown-soft);
  background: rgba(247, 241, 232, .82);
  backdrop-filter: blur(7px);
}

.menu-section { padding: 34px 0 70px; }

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
}

.section-heading h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1;
}

.section-note {
  font-size: 11px;
  color: var(--brown-muted);
  padding-bottom: 4px;
}

.categories {
  position: sticky;
  top: 0;
  z-index: 8;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0 14px;
  margin: 0 -18px 22px;
  padding-right: 18px;
  padding-left: 18px;
  background: rgba(247, 241, 232, .88);
  backdrop-filter: blur(13px);
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.category-chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: rgba(255, 253, 249, .75);
  color: var(--brown-soft);
  padding: 9px 15px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
}

.category-chip.active {
  background: var(--brown);
  color: #fffaf3;
  border-color: var(--brown);
}

.category-chip:active { transform: scale(.97); }

.product-section {
  scroll-margin-top: 76px;
  margin-bottom: 46px;
}

.product-section:last-child { margin-bottom: 0; }

.product-section-title {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 16px;
}

.product-section-title h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 600;
}

.title-line {
  height: 1px;
  flex: 1;
  background: var(--line);
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.product-card {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(58, 40, 32, .08);
  border-radius: var(--radius-md);
  background: rgba(255, 253, 249, .84);
  box-shadow: 0 8px 25px rgba(58, 40, 32, .055);
  cursor: pointer;
  transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
  opacity: 0;
  transform: translateY(14px);
}

.product-card.revealed {
  opacity: 1;
  transform: translateY(0);
  transition: opacity .55s ease, transform .55s cubic-bezier(.2,.7,.2,1), box-shadow .28s ease;
}

.product-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
  border-color: rgba(183, 150, 97, .22);
}

.product-card:active { transform: scale(.985); }

.product-image {
  width: 100%;
  aspect-ratio: 1 / .92;
  object-fit: cover;
  background: var(--beige);
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}

.product-card:hover .product-image { transform: scale(1.035); }

.product-info { padding: 13px 13px 15px; }

.product-name {
  margin: 0 0 5px;
  font-size: 14px;
  line-height: 1.45;
  font-weight: 700;
}

.product-desc {
  margin: 0 0 11px;
  color: var(--brown-muted);
  font-size: 10.5px;
  line-height: 1.7;
  min-height: 34px;
}

.product-price {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-weight: 700;
  font-size: 15px;
}

.product-price small {
  font-size: 9px;
  color: var(--brown-muted);
  font-weight: 500;
}

.footer {
  padding: 54px 0 42px;
  text-align: center;
  border-top: 1px solid var(--line);
  color: var(--brown-soft);
}

.footer-logo {
  font-family: var(--serif);
  font-size: 34px;
  color: var(--brown);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.footer p {
  margin: 16px 0 2px;
  font-size: 13px;
  font-weight: 600;
}

.footer span {
  font-size: 11px;
  color: var(--brown-muted);
}

.to-top {
  position: fixed;
  z-index: 20;
  left: 18px;
  bottom: 18px;
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255, 253, 249, .92);
  color: var(--brown);
  box-shadow: 0 10px 28px rgba(58, 40, 32, .13);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity .25s ease, transform .25s ease;
  backdrop-filter: blur(9px);
}

.to-top.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(30, 20, 15, .48);
  backdrop-filter: blur(5px);
  opacity: 0;
  transition: opacity .25s ease;
}

.modal-backdrop.show { opacity: 1; }

.product-sheet {
  position: fixed;
  z-index: 51;
  left: 0;
  right: 0;
  bottom: 0;
  width: min(620px, 100%);
  margin: 0 auto;
  overflow: hidden;
  border-radius: 28px 28px 0 0;
  background: var(--paper);
  box-shadow: 0 -20px 70px rgba(30, 20, 15, .2);
  transform: translateY(102%);
  transition: transform .42s cubic-bezier(.2,.85,.2,1);
  max-height: 91svh;
  overflow-y: auto;
}

.product-sheet.show { transform: translateY(0); }

.sheet-close {
  position: absolute;
  z-index: 3;
  top: 14px;
  left: 14px;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(58, 40, 32, .12);
  border-radius: 50%;
  background: rgba(255, 253, 249, .82);
  color: var(--brown);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.sheet-image-wrap {
  width: 100%;
  aspect-ratio: 1.45 / 1;
  max-height: 52svh;
  background: var(--beige);
  overflow: hidden;
}

.sheet-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sheet-content { padding: 23px 22px 28px; }

.sheet-kicker {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .14em;
  font-weight: 700;
}

.sheet-content h2 {
  margin: 6px 0 8px;
  font-family: var(--serif);
  font-size: 34px;
  line-height: 1.2;
}

.sheet-content p {
  margin: 0;
  color: var(--brown-soft);
  line-height: 1.9;
  font-size: 13px;
}

.sheet-price {
  margin-top: 17px;
  font-size: 19px;
  font-weight: 700;
}

.sheet-price::after {
  content: " ريال";
  color: var(--brown-muted);
  font-size: 11px;
  font-weight: 500;
}

.close-label {
  margin-top: 20px;
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--brown);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.noscript {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 30px;
  background: var(--cream);
  text-align: center;
}

[hidden] { display: none !important; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes heroIn {
  from { opacity: 0; transform: scale(.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@media (min-width: 680px) {
  .page-shell { padding: 0 28px; }
  .hero {
    grid-template-columns: 1.05fr .95fr;
    min-height: 680px;
    gap: 20px;
    padding-top: 20px;
  }
  .hero-copy { order: 1; }
  .hero-visual { order: 2; width: min(44vw, 510px); }
  .products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .categories { margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; }
}

@media (min-width: 1024px) {
  .site-header { height: 82px; }
  .hero { min-height: 710px; padding-bottom: 82px; }
  .hero h1 { font-size: clamp(70px, 7vw, 98px); }
  .hero p { font-size: 16px; }
  .menu-section { padding-top: 56px; }
  .products-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .product-info { padding: 15px 15px 17px; }
  .product-name { font-size: 15px; }
  .product-desc { font-size: 11px; }
  .product-sheet { width: min(720px, 100%); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
.logo-image{mix-blend-mode:multiply}


/* =========================================================
   Scroll-first performance mode
   Keeps the premium layout while doing zero work during scroll.
   ========================================================= */
html, body {
  scroll-behavior: auto !important;
  -webkit-overflow-scrolling: touch;
  background-image: none !important;
}
body::before, body::after { display: none !important; }

.product-card,
.product-card.revealed,
.product-image,
.hero-visual,
.hero-image-wrap,
.category-chip,
.logo-image,
.footer-logo-image {
  animation: none !important;
  transition: none !important;
  transform: none !important;
  filter: none !important;
  will-change: auto !important;
}

.product-card,
.product-card.revealed {
  opacity: 1 !important;
  transform: none !important;
  box-shadow: none !important;
}

.product-card:hover,
.product-card:active,
.product-card:focus,
.product-card:hover .product-image {
  transform: none !important;
  box-shadow: none !important;
}

.product-image {
  display: block;
  transform: none !important;
  backface-visibility: hidden;
}

.categories {
  -webkit-overflow-scrolling: touch;
  scroll-behavior: auto !important;
}

.to-top { display: none !important; }

.modal-backdrop {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

@media (max-width: 760px) {
  .product-card {
    border: 1px solid rgba(58, 40, 32, .08) !important;
  }
  .hero-image-wrap { box-shadow: none !important; }
}


/* الشعار الرئيسي في الواجهة — ثابت وخفيف بدون أنيميشن */
.hero-brand-logo {
  width: min(330px, 78vw);
  margin: 16px 0 18px;
}
.hero-brand-logo img {
  width: 100%;
  height: auto;
  display: block;
  mix-blend-mode: multiply;
  border-radius: 12px;
}
@media (min-width: 760px) {
  .hero-brand-logo { width: min(390px, 36vw); }
}

</style>
</head>

const productSections = document.getElementById("product-sections");
const categoryButtons = [...document.querySelectorAll(".category-chip")];
const toTop = document.getElementById("toTop");
const sheet = document.getElementById("productSheet");
const backdrop = document.getElementById("modalBackdrop");
const sheetImage = document.getElementById("sheetImage");
const sheetTitle = document.getElementById("sheetTitle");
const sheetDescription = document.getElementById("sheetDescription");
const sheetPrice = document.getElementById("sheetPrice");
const sheetCategory = document.getElementById("sheetCategory");
const sheetClose = document.getElementById("sheetClose");
const sheetCloseLabel = document.getElementById("sheetCloseLabel");

const formatter = new Intl.NumberFormat("ar-SA");

function productCard(product) {
  return `
    <article class="product-card" tabindex="0" role="button"
      data-product-id="${product.id}"
      aria-label="عرض تفاصيل ${product.name}">
      <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
        loading="lazy"
        decoding="async"
      >
      <div class="product-info">
        <h4 class="product-name">${product.name}</h4>
        <p class="product-desc">${product.description}</p>
        <div class="product-price">${formatter.format(product.price)} <small>ريال</small></div>
      </div>
    </article>
  `;
}

function renderMenu() {
  productSections.innerHTML = Object.entries(categoryMeta).map(([key, label]) => {
    const items = products.filter(product => product.category === key);
    return `
      <section class="product-section" id="category-${key}" data-category-section="${key}">
        <div class="product-section-title">
          <h3>${label}</h3>
          <span class="title-line" aria-hidden="true"></span>
        </div>
        <div class="products-grid">
          ${items.length ? items.map(productCard).join("") : `
            <p class="empty-state">لا توجد منتجات في هذا القسم حاليًا.</p>
          `}
        </div>
      </section>
    `;
  }).join("");

  observeCards();
}

function observeCards() {
  document.querySelectorAll(".product-card").forEach(card => card.classList.add("revealed"));
}

function openProduct(productId) {
  const product = products.find(item => item.id === Number(productId));
  if (!product) return;

  sheetImage.src = product.image;
  sheetImage.alt = product.name;
  sheetTitle.textContent = product.name;
  sheetDescription.textContent = product.description;
  sheetPrice.textContent = formatter.format(product.price);
  sheetCategory.textContent = categoryMeta[product.category] || "";

  backdrop.hidden = false;
  sheet.hidden = false;
  document.body.classList.add("modal-open");

  requestAnimationFrame(() => {
    backdrop.classList.add("show");
    sheet.classList.add("show");
  });

  sheetClose.focus();
}

function closeProduct() {
  sheet.classList.remove("show");
  backdrop.classList.remove("show");
  document.body.classList.remove("modal-open");

  setTimeout(() => {
    sheet.hidden = true;
    backdrop.hidden = true;
  }, 420);
}

function scrollToCategory(category) {
  const target = document.getElementById(`category-${category}`);
  if (!target) return;
  target.scrollIntoView({ behavior: "auto", block: "start" });

  categoryButtons.forEach(button => {
    button.classList.toggle("active", button.dataset.category === category);
  });
}

categoryButtons.forEach(button => {
  button.addEventListener("click", () => scrollToCategory(button.dataset.category));
});

productSections.addEventListener("click", event => {
  const card = event.target.closest(".product-card");
  if (card) openProduct(card.dataset.productId);
});

productSections.addEventListener("keydown", event => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const card = event.target.closest(".product-card");
  if (!card) return;
  event.preventDefault();
  openProduct(card.dataset.productId);
});

[sheetClose, sheetCloseLabel, backdrop].forEach(element => {
  element.addEventListener("click", closeProduct);
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !sheet.hidden) closeProduct();
});

toTop.hidden = true;

renderMenu();
</script>
